name: Lua regression (WoW mock, not in-game)
# New and LEGACY tests are automatically discovered by the shared runner.
on:
  push:
    branches: [main]
    paths:
      - 'KordRotation/**'
      - 'KordRotationDevTools/**'
      - 'tests/**'
      - 'scripts/run_local_lua_regression.sh'
      - 'scripts/check_lua_syntax.lua'
      - '.github/workflows/lua-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Run all Lua 5.1 mock tests, syntax and Python checks
        shell: bash
        run: bash scripts/run_local_lua_regression.sh
