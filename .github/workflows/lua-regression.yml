name: Lua regression (WoW mock, not in-game)
# Automatically validate updates to the engine and regression tests.
# The workflow performs Lua 5.1 mocks, not in-game verification.
on:
  push:
    branches: [main]
    paths:
      - 'KordRotation/**'
      - 'KordRotationDevTools/**'
      - 'tests/**'
      - '.github/workflows/lua-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check syntax of all game modules and mock tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            luac5.1 -p "$f"
          done < <(find KordRotation KordRotationDevTools tests -name '*.lua' -type f -print0)
      - name: Run existing and canonical v14 mock tests
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tests/stage_02_03_game_state.lua \
            tests/aura_cooldown_viewer_reference.lua \
            tests/stage_02_04_spell_catalogue.lua \
            tests/stage_02_05_actionbar.lua \
            tests/stage_02_06_bindings.lua \
            tests/stage_02_07_eligibility.lua \
            tests/profile_contract_v1.lua \
            tests/stage_02_08_v14_state.lua \
            tests/stage_02_08_v14_argument_guards.lua \
            tests/stage_02_08_v14_display.lua \
            tests/stage_02_08_v14_observation.lua \
            tests/devtools_recorder.lua \
            tests/devtools_probe.lua \
            tests/devtools_trace.lua \
            tests/devtools_boot.lua \
            tests/devtools_ui_locale.lua \
            tests/devtools_v14_registry.lua \
            tests/devtools_trace_signals.lua \
            tests/hunter_bm_rank_selection.lua \
            tests/hunter_bm_leveling_contract.lua \
            tests/hunter_bm_aspect_switch.lua \
            tests/combat_aura_routing.lua \
            tests/indicator_slider_bounds.lua \
            tests/hunter_bm_aspect_bar_rank.lua \
            tests/rotation_module_config.lua \
            tests/bm_full_audit.lua \
            tests/diagnostics_devtools_launch.lua; do
            echo "RUN $f"
            lua5.1 "$f"
          done
      - name: Verify byte-identical packaging and TOC references
        run: python3 -m unittest discover -s tests -p 'test_build_variants.py' -v
